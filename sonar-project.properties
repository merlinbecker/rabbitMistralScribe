sonar.projectKey=merlinbecker_rabbitMistralScribe
sonar.organization=merlinbecker

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=rabbitMistralScribe
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=client/src,server,public,shared
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,test.js
sonar.test.inclusions=**/tests/**/*.js,**/tests/**/*.ts,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts,test.js

# Language
sonar.sourceEncoding=UTF-8

# Enable JavaScript/TypeScript analysis
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx
